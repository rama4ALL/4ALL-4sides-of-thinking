<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4ALL | 4 Sides of Thinking</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10151b;
            color: white;
        }

        header {
            padding: 50px 20px;
            text-align: center;
            background: #18222b;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b8c1c9;
        }

        .library {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1000px;
            margin: auto;
        }

        .book {
            background: #1b252e;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid #303c46;
        }

        .book h2 {
            margin-top: 10px;
        }

        .book p {
            color: #b8c1c9;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #8ee65b;
            color: #10151b;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>4ALL</h1>
    <p class="subtitle">4 Sides of Thinking</p>
    <p>Digital Psychology Library</p>
</header>

<main class="library">

    <div class="book">
        <div style="font-size: 50px;">🧠</div>
        <h2>Sisi Otak</h2>
        <p>Pola pikir sehat dan positif.</p>
        <button>Baca</button>
    </div>

    <div class="book">
        <div style="font-size: 50px;">🧘</div>
        <h2>Peace</h2>
        <p>Ketenangan, sikap, dan mental.</p>
        <button>Baca</button>
    </div>

    <div class="book">
        <div style="font-size: 50px;">📖</div>
        <h2>Sisi Buku</h2>
        <p>Pengetahuan dan cara belajar.</p>
        <button>Baca</button>
    </div>

    <div class="book">
        <div style="font-size: 50px;">⚙️</div>
        <h2>Sisi Roda Gigi</h2>
        <p>Pendidikan, perilaku, perkembangan, dan kognitif.</p>
        <button>Baca</button>
    </div>

</main>

</body>
  </html>
